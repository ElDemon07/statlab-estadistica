<style>*{box-sizing:border-box}body{margin:0;background:#081425;color:#e9f4ff;font:15px system-ui}header{background:#10233d;padding:22px;border-bottom:1px solid #35506e}h1{margin:0;color:#65d9ff}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{background:#204264;color:white;border:1px solid #3c6689;border-radius:9px;padding:11px;cursor:pointer}button:hover{background:#31658c}main{max-width:1100px;margin:auto;padding:24px}.card{background:#11243e;border:1px solid #2c4c70;border-radius:14px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;margin:10px 0;color:#b8d1e8}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #507395;border-radius:8px;background:#08172a;color:white}strong.big{font-size:34px;color:#6fe6d4}.muted{color:#a9bdd5}.active{background:#176c92}.error{color:#ffabab}svg{width:100%;height:220px}.small{font-size:12px;color:#9eb6d1}.problem{margin-bottom:22px}.statement{line-height:1.65;color:#e4efff}.incisos{display:grid;gap:10px;margin-top:18px}.inciso{padding:12px 0;border-top:1px solid #2c4c70;display:flex;gap:16px;align-items:center;justify-content:space-between}.inciso-text{line-height:1.55;flex:1}.inciso button{flex-shrink:0}.detail{margin-top:12px;padding:15px;background:#0a1b30;border:1px solid #385b7e;border-radius:10px;line-height:1.65}.detail h4{margin:0 0 10px;color:#76dafa}.detail p{margin:7px 0}.detail input{max-width:210px}.return-nav{margin:0 0 12px}.return-nav button{background:#165c79;border-color:#3a9abd;font-weight:650}.return-nav button:hover{background:#20779b}.pass{color:#77e2ba}.fail{color:#ffb4a7}@media(max-width:650px){.inciso{display:block}.inciso button{margin-top:10px}}a{color:#7edaff}.doc-item{padding:17px;border:1px solid #355675;border-radius:11px;background:#0a1b30;margin:13px 0}.doc-item h3{margin:0 0 8px}.pending{display:inline-block;padding:7px 11px;border-radius:8px;background:#263b52;color:#d0 <header><h1>◈ STATLAB</h1><div>Simulador general de probabilidades · Estadística I</div><nav><button onclick="page('home')">Inicio</button><button onclick="page('calc')">Simulador general</button><button onclick="page('guide')">Los 8 ejercicios</button><button onclick="page('expo')">Mi exposición (3, 2, 6)</button><button onclick="page('docs')">Documentación del proyecto</button></nav></header><main id="app"></main>

let returnTarget=null;
function returnToExercise(){
 if(!returnTarget)return;
 const target={...returnTarget};
 page(target.section);
 showPart(target.id,target.letter);
 const anchor=document.getElementById(`detail-${target.id}-${target.letter}`);
 if(anchor)anchor.closest('.inciso').scrollIntoView({block:'center',behavior:'instant'});

const names={bin:'Binomial',neg:'Binomial negativa',poi:'Poisson',exp:'Exponencial',nor:'Normal'};
const problems=[
['Vulnerabilidades','bin',{n:18,p:.12},[['a','exact',3],['b','le',2],['c','ge',4],['d','ge',1]]],
['Retransmisiones','neg',{r:5,p:.75},[['a','exact',7],['b','le',8],['c','ge',9],['d','exact',5]]],
['Alertas SOC','poi',{lambda:12},[['a','exact',12],['b','ge',16],['c','le',3,{lambda:3}]]],
['Servidores','bin',{n:20,p:.08},[['a','exact',4],['b','le',3],['c','ge',5]]],
['Solicitudes API','poi',{lambda:6},[['a','exact',8],['b','ge',11],['c','exact',0,{lambda:3}]]],
['Validación QA','neg',{r:6,p:.65},[['a','exact',10],['b','le',8],['c','ge',11],['d','ge',9]]],
['Mensajería','exp',{lambda:.2},[['a','le',4],['b','gt',10],['c','between',3,{upper:8}],['d','quantile',.9],['e','gt',15]]],
['Base de datos','nor',{mu:240,sigma:35},[['a','gt',300],['b','between',210,{upper:280}],['c','lt',200],['d','quantile',.95],['e','le',300],['f','le',300,{mu:220,sigma:55}]]]
];
const statements=[{"statement": "Detección de vulnerabilidades en una auditoría de ciberseguridad. Una empresa especializada en ciberseguridad realiza auditorías sobre aplicaciones web utilizadas por instituciones financieras. Durante una evaluación, los analistas seleccionan aleatoriamente 18 componentes de software. Según los registros históricos, cada componente tiene una probabilidad del 12 % de presentar una vulnerabilidad crítica. Para este análisis se supone que las condiciones de los componentes son independientes y que la probabilidad de encontrar una vulnerabilidad es constante. La política de seguridad establece que, si se detectan 4 o más componentes vulnerables, deberá suspenderse temporalmente la liberación del sistema.", "parts": {"a": "Determine la probabilidad de encontrar exactamente 3 componentes con vulnerabilidades críticas.", "b": "Calcule la probabilidad de que se encuentren como máximo 2 componentes vulnerables.", "c": "Determine la probabilidad de que se active la política de suspensión del lanzamiento.", "d": "Calcule la probabilidad de que al menos 1 componente presente una vulnerabilidad crítica.", "e": "Si la empresa considera aceptable un riesgo máximo del 10 % de suspender la liberación, determine si el proyecto cumple este criterio.", "f": "Explique cómo podría cambiar el modelo si varios componentes compartieran una misma biblioteca vulnerable."}}, {"statement": "Recuperación de paquetes en una red de comunicaciones: Una empresa de telecomunicaciones está evaluando un protocolo de recuperación de paquetes de datos. Cuando se detecta un paquete corrupto, el sistema solicita su retransmisión. Cada intento tiene una probabilidad del 75 % de completarse correctamente, de manera independiente. Para restablecer una comunicación, el protocolo necesita obtener 5 retransmisiones exitosas. El sistema cuenta con una política que permite realizar un máximo de 8 intentos antes de activar un mecanismo alternativo de recuperación.", "parts": {"a": "Determine la probabilidad de que la quinta retransmisión exitosa ocurra exactamente en el séptimo intento.", "b": "Calcule la probabilidad de completar las 5 retransmisiones exitosas en un máximo de 8 intentos.", "c": "Determine la probabilidad de necesitar al menos 9 intentos para completar las 5 retransmisiones exitosas.", "d": "Calcule la probabilidad de completar las 5 retransmisiones exitosas exactamente en el quinto intento.", "e": "Si el protocolo requiere una probabilidad mínima del 95 % de completar la recuperación dentro de los 8 intentos, determine si cumple con el requisito.", "f": "¿Qué sucedería si la pérdida de paquetes estuviera relacionada con períodos de congestión y los intentos consecutivos dejaran de ser independientes?"}}, {"statement": "Monitoreo de incidentes en un centro de operaciones de seguridad. Un Centro de Operaciones de Seguridad (SOC) monitorea la infraestructura tecnológica de una organización. Los registros indican que se producen, en promedio, 9 alertas de seguridad cada 15 minutos. Se supone que las alertas ocurren independientemente y con una tasa promedio constante durante el período estudiado. El sistema de monitoreo considera que existe una posible situación de riesgo elevado cuando se registran más de 15 alertas durante 20 minutos.", "parts": {"a": "Determine el número promedio de alertas esperadas durante 20 minutos.", "b": "Calcule la probabilidad de registrar exactamente 12 alertas durante 20 minutos.", "c": "Determine la probabilidad de que el sistema identifique una situación de riesgo elevado durante ese intervalo.", "d": "Calcule la probabilidad de recibir como máximo 3 alertas durante un período de 5 minutos.", "e": "Si el SOC desea que las falsas alarmas asociadas únicamente a la frecuencia normal de eventos sean inferiores al 5 %, analice si el umbral establecido resulta adecuado bajo el modelo.", "f": "Análisis técnico: Explique por qué un aumento en la frecuencia de alertas no necesariamente implica que se esté produciendo un ataque informático."}}, {"statement": "Disponibilidad de servidores en una infraestructura de nube: Infraestructura y cloud computing: Una empresa de servicios tecnológicos administra una plataforma de comercio electrónico mediante una infraestructura de 20 servidores virtuales. Durante las pruebas de disponibilidad, el departamento de operaciones ha determinado que cada servidor tiene una probabilidad del 8 % de presentar una falla durante una ventana de mantenimiento de dos horas. Para efectos del análisis, se considera que las fallas de los servidores ocurren de manera independiente y que todos tienen la misma probabilidad de fallar. El sistema cuenta con mecanismos de redundancia que permiten mantener la operación normal siempre que no fallen más de 3 servidores durante esa ventana.", "parts": {"a": "Determine la probabilidad de que exactamente 4 servidores presenten fallas.", "b": "Calcule la probabilidad de que fallen como máximo 3 servidores.", "c": "Determine la probabilidad de que fallen al menos 5 servidores.", "d": "Si la empresa exige una disponibilidad operativa del 95 % durante estas ventanas, ¿el sistema cumple el requisito bajo el criterio de tolerancia establecido?", "e": "Explique por qué el hecho de tener 20 servidores no significa que necesariamente se presentarán fallas en todos ellos.", "f": "¿Qué sucedería con la confiabilidad del modelo si los servidores dependieran de un mismo suministro eléctrico y pudieran fallar simultáneamente?"}}, {"statement": "Saturación de solicitudes en una API empresarial (Backend y rendimiento): Una empresa desarrolló una API REST que permite consultar información de inventarios en tiempo real. El equipo de desarrollo ha observado que, durante determinados períodos, el sistema recibe en promedio 18 solicitudes cada 3 minutos. Se considera que las solicitudes llegan independientemente y con una tasa promedio constante durante el período analizado. El servidor dispone de un mecanismo de protección que genera una alerta cuando recibe más de 10 solicitudes en un minuto.", "parts": {"a": "Determine la cantidad promedio de solicitudes esperadas durante un minuto.", "b": "Calcule la probabilidad de que exactamente 8 solicitudes lleguen durante un minuto.", "c": "Determine la probabilidad de que el sistema active la alerta en un minuto.", "d": "Calcule la probabilidad de que durante un intervalo de 30 segundos no se reciba ninguna solicitud.", "e": "Si la probabilidad de activar la alerta supera el 5 %, el equipo considera necesario revisar el umbral. ¿Qué recomendaría?", "f": "Explique por qué sería incorrecto utilizar directamente el promedio de 18 solicitudes para calcular una probabilidad correspondiente a un intervalo de un minuto."}}, {"statement": "Validación de módulos durante pruebas de software: Testing y aseguramiento de calidad, Una empresa de desarrollo está implementando un sistema de gestión académica. Antes de liberar la nueva versión, el equipo de QA ejecuta pruebas de validación sobre módulos seleccionados de un conjunto amplio de componentes. De acuerdo con los registros históricos, cada prueba tiene una probabilidad del 65 % de resultar satisfactoria. Para este estudio se supone que las pruebas son independientes y mantienen la misma probabilidad de éxito. El responsable del proyecto necesita obtener 6 pruebas satisfactorias para completar una fase de validación.", "parts": {"a": "Calcule la probabilidad de que la sexta prueba satisfactoria ocurra exactamente en el décimo intento.", "b": "Determine la probabilidad de completar las 6 pruebas satisfactorias en un máximo de 8 intentos.", "c": "Calcule la probabilidad de necesitar más de 10 intentos para alcanzar las 6 pruebas satisfactorias.", "d": "Si el equipo dispone de recursos para ejecutar únicamente 8 pruebas, ¿cuál es el riesgo de no completar la validación?", "e": "Explique por qué el número total de pruebas no se conoce de antemano, aunque sí se conoce la cantidad de resultados satisfactorios que se desea alcanzar.", "f": "¿Qué limitación tendría este modelo si las pruebas repetidas fueran sobre el mismo módulo y los errores corregidos modificaran la probabilidad de éxito?"}}, {"statement": "Tiempo de espera en un sistema de mensajería (Redes y sistemas distribuidos) Una empresa de logística utiliza una arquitectura de microservicios para procesar mensajes relacionados con pedidos, entregas y actualizaciones de inventario. Durante las horas de operación, un servicio recibe en promedio 12 mensajes por minuto. Para el análisis, se supone que los mensajes llegan siguiendo un proceso con tasa constante e independiente. El equipo de monitoreo está interesado en el tiempo transcurrido desde un instante de observación hasta la llegada del siguiente mensaje, debido a que ciertos procesos dependen de la recepción de nuevos eventos.", "parts": {"a": "Determine la probabilidad de que el siguiente mensaje llegue antes de 4 segundos.", "b": "Calcule la probabilidad de que transcurran más de 10 segundos sin recibir un nuevo mensaje.", "c": "Determine la probabilidad de que el siguiente mensaje llegue entre 3 y 8 segundos.", "d": "Calcule el tiempo de espera \\(t\\) para el cual existe un 90 % de probabilidad de que el siguiente mensaje ya haya llegado.", "e": "Un desarrollador propone generar una alerta si transcurren más de 15 segundos sin recibir mensajes. Calcule la probabilidad de que se produzca esa situación bajo condiciones normales y evalúe si sería una alerta frecuente.", "f": "Justifique por qué es indispensable convertir correctamente las unidades de tiempo y explique qué supuesto podría dejar de cumplirse si los mensajes llegaran en lotes programados."}}, {"statement": "Evaluación del rendimiento de una base de datos (Bases de datos y optimización) Una institución financiera implementó una nueva base de datos para procesar consultas relacionadas con movimientos y transacciones. Después de ejecutar pruebas de rendimiento, el equipo de ingeniería determinó que los tiempos de respuesta individuales pueden aproximarse mediante una distribución normal, con los siguientes parámetros: Tiempo promedio 240 ms, Desviación estándar 35 ms. El contrato de nivel de servicio (SLA) establece que al menos el 95 % de las consultas debe responder en 300 milisegundos o menos.", "parts": {"a": "Determine la probabilidad de que una consulta tarde más de 300 milisegundos.", "b": "Calcule la probabilidad de que una consulta tenga un tiempo de respuesta entre 210 y 280 milisegundos.", "c": "Determine el porcentaje de consultas que responden en menos de 200 milisegundos.", "d": "Calcule el tiempo máximo de respuesta correspondiente al percentil 95 de la distribución.", "e": "Con base en los resultados, determine si la base de datos cumple el SLA establecido y justifique su conclusión.", "f": "Análisis técnico: Si la media disminuyera a 220 ms, pero la desviación estándar aumentara a 55 ms, ¿sería necesariamente mejor el rendimiento respecto al SLA? Realice el cálculo correspondiente y explique su respuesta."}}];
const initial={bin:{n:18,p:.12,k:3,upper:5,mode:'exact'},neg:{r:5,p:.75,k:7,upper:8,mode:'exact'},poi:{lambda:12,k:12,upper:16,mode:'exact'},exp:{lambda:.2,k:4,upper:8,mode:'le'},nor:{mu:240,sigma:35,k:300,upper:320,mode:'le'}};
let state=structuredClone(initial),dist='bin';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function choose(d){returnTarget=null;dist=d;page('calc')}
function comb(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let v=1;for(let i=1;i<=k;i++)v*= (n-k+i)/i;return v}
function pmf(d,k,s){if(d==='bin')return k<0||k>s.n?0:comb(s.n,k)*s.p**k*(1-s.p)**(s.n-k);if(d==='neg')return k<s.r?0:comb(k-1,s.r-1)*s.p**s.r*(1-s.p)**(k-s.r);if(k<0)return 0;let v=Math.exp(-s.lambda);for(let j=1;j<=k;j++)v*=s.lambda/j;return v}
function erf(x){let sign=x<0?-1:1;x=Math.abs(x);let t=1/(1+.3275911*x);return sign*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
function phi(z){return (1+erf(z/Math.SQRT2))/2}
function cdf(d,x,s){if(d==='exp')return x<0?0:1-Math.exp(-s.lambda*x);if(d==='nor')return phi((x-s.mu)/s.sigma);let sum=0;for(let i=d==='neg'?s.r:0;i<=Math.floor(x);i++)sum+=pmf(d,i,s);return Math.min(1,sum)}
function compute(d,s){const discrete=['bin','neg','poi'].includes(d);if(Object.entries(s).some(([k,v])=>k!=='mode'&&!Number.isFinite(v)))throw Error('Ingrese valores numéricos válidos en todos los campos.');if((d==='bin'&&(!Number.isInteger(s.n)||s.n<0||s.n>500))||(d==='neg'&&(!Number.isInteger(s.r)||s.r<1||s.r>500)))throw Error('Los parámetros n y r deben ser números enteros válidos (máximo 500).');if(['bin','neg'].includes(d)&&(s.p<0||s.p>1||(d==='neg'&&s.p===0)))throw Error('La probabilidad p debe estar entre 0 y 1 (mayor que 0 para binomial negativa).');if(['poi','exp'].includes(d)&&s.lambda<=0)throw Error('λ debe ser positivo.');if(d==='nor'&&s.sigma<=0)throw Error('σ debe ser positivo.');if(discrete&&(!Number.isInteger(s.k)||s.k<0||!Number.isInteger(s.upper)||s.upper<0))throw Error('Los conteos deben ser enteros no negativos.');if(d==='exp'&&(s.k<0||s.upper<0))throw Error('Los tiempos deben ser no negativos.');
const {k,upper,mode}=s;
if(mode==='quantile'){if(k<=0||k>=1)throw Error('Para calcular percentiles, ingrese una probabilidad entre 0 y 1.');if(d==='exp')return [-Math.log(1-k)/s.lambda,true];if(d==='nor'){let lo=-12,hi=12;for(let i=0;i<80;i++){let m=(lo+hi)/2;if(phi(m)<k)lo=m;else hi=m}return [s.mu+s.sigma*(lo+hi)/2,true]}let lo=d==='neg'?s.r:0,hi=d==='bin'?s.n:Math.max(10,lo);while(cdf(d,hi,s)<k&&hi<10000)hi=hi*2+1;while(lo<hi){let mid=Math.floor((lo+hi)/2);if(cdf(d,mid,s)>=k)hi=mid;else lo=mid+1}return [lo,true]}
if(mode==='exact'){if(!discrete)throw Error('En distribuciones continuas P(X=x)=0. Seleccione un intervalo.');return [pmf(d,k,s),false]}
if(mode==='le')return [cdf(d,k,s),false];
if(mode==='lt')return [cdf(d,discrete?k-1:k,s),false];
if(mode==='ge')return [1-cdf(d,discrete?k-1:k,s),false];
if(mode==='gt')return [1-cdf(d,k,s),false];
if(mode==='between'){if(upper<k)throw Error('El límite superior debe ser mayor o igual al inferior.');return [cdf(d,upper,s)-cdf(d,discrete?k-1:k,s),false]}
}
const field=(key,label,s)=>`<label>${label}<input type="number" step="any" value="${s[key]}" oninput="setVal('${key}',this.value)"></label>`;
function setVal(key,v){state[dist][key]=v.trim()===''?NaN:Number(v);result()}
function setMode(v){state[dist].mode=v;if(v==='quantile')state[dist].k=.95;page('calc')}
function reset(){state[dist]={...initial[dist]};page('calc')}
function page(p){if(p==='guide'||p==='expo')currentSection=p;let a=document.getElementById('app');if(p==='home'){a.innerHTML=`<div class="card"><h2>Laboratorio estadístico universal</h2><p class="muted">Seleccione una distribución e ingrese los parámetros para calcular probabilidades.</p><div class="grid">${Object.keys(names).map(d=>`<button onclick="choose('${d}')">${names[d]} →</button>`).join('')}</div></div>`;return}
if(p==='docs'){a.innerHTML=`<div class="card"><h2>Documentación del proyecto</h2><p class="muted">En esta sección se encuentran los documentos correspondientes al proyecto final de Estadística I.</p><div class="doc-item"><h3>Soluciones manuscritas</h3><p>Documento PDF con los procedimientos y respuestas de los ejercicios de la guía.</p><span class="pending">Documento pendiente de publicación</span></div><div class="doc-item"><h3>Video explicativo</h3><p>Presentación de los ejercicios asignados y comprobación de resultados en el simulador web.</p><span class="pending">Video pendiente de publicación</span></div><p><button onclick="page('home')">← Volver al inicio</button></p></div>`;return}
if(p==='guide'||p==='expo'){
let ids=p==='expo'?[3,2,6]:[1,2,3,4,5,6,7,8];
a.innerHTML=`<h2>${p==='expo'?'Ejercicios de exposición':'Guía completa'}</h2>${ids.map(id=>{
let problem=problems[id-1],doc=statements[id-1];
return `<section class="card problem"><h3>Ejercicio ${id}: ${problem[0]}</h3><p class="small">${names[problem[1]]}</p><p class="statement">${escapeHtml(doc.statement)}</p><div class="incisos">${Object.entries(doc.parts).map(([letter,body])=>{
let isConcept=conceptual[id]?.[letter];
let label=isConcept?'Ver análisis técnico':evaluation[id]?.[letter]?'Evaluar criterio':'Comprobar resultado';
return `<div class="inciso"><div class="inciso-text"><b>${letter})</b> ${escapeHtml(body)}<div id="detail-${id}-${letter}"></div></div><button onclick="showPart(${id},'${letter}')">${label}</button></div>`
}).join('')}</div></section>`}).join('')}`;return}

let s=state[dist],fs={bin:[['n','Ensayos n'],['p','Probabilidad p']],neg:[['r','Éxitos requeridos r'],['p','Probabilidad p']],poi:[['lambda','Media λ del intervalo']],exp:[['lambda','Tasa λ por unidad de tiempo']],nor:[['mu','Media μ'],['sigma','Desviación σ']]};let ops=[['exact','Exactamente'],['le','Como máximo / ≤'],['lt','Menor que / <'],['ge','Al menos / ≥'],['gt','Mayor que / >'],['between','Entre dos valores'],['quantile','Percentil / cuantil']].filter(o=>!['exp','nor'].includes(dist)||o[0]!=='exact');
a.innerHTML=`${returnTarget?`<div class="return-nav"><button onclick="returnToExercise()">← Volver al ejercicio ${returnTarget.id}, inciso ${returnTarget.letter})</button></div>`:''}<div class="card"><h2>Simulador general</h2><div class="grid"><label>Distribución<select onchange="choose(this.value)">${Object.keys(names).map(d=>`<option value="${d}" ${d===dist?'selected':''}>${names[d]}</option>`).join('')}</select></label><label>Operación<select onchange="setMode(this.value)">${ops.map(o=>`<option value="${o[0]}" ${o[0]===s.mode?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><div class="grid">${fs[dist].map(f=>field(f[0],f[1],s)).join('')}${field('k',s.mode==='quantile'?'Probabilidad acumulada (0–1)':dist==='exp'?'Tiempo t':dist==='nor'?'Valor x':'Número de eventos / intento k',s)}${s.mode==='between'?field('upper','Límite superior',s):''}</div><p><button onclick="reset()">Restablecer valores</button></p></div><div class="card" id="out"></div>`;result()}

const conceptual={1:{f:1},2:{f:1},3:{f:1},4:{e:1,f:1},5:{f:1},6:{e:1,f:1},7:{f:1}};
const evaluation={1:{e:1},2:{e:1},3:{e:1},4:{d:1},5:{e:1},7:{e:1},8:{e:1,f:1}};
const explanations={
'1f':'Si los componentes comparten una biblioteca vulnerable, sus fallas pueden estar correlacionadas. La distribución binomial presupone independencia; sería necesario modelar dependencias o fallas de causa común.',
'2f':'La congestión puede provocar pérdidas consecutivas correlacionadas y modificar la probabilidad de éxito de cada intento. La binomial negativa simple dejaría de describir adecuadamente el proceso.',
'3f':'Un aumento de alertas también puede deberse a cambios de configuración, errores de monitoreo, actualizaciones, actividad legítima o reglas de detección demasiado sensibles. La frecuencia por sí sola no demuestra un ataque; se requiere analizar contexto y evidencia.',
'4e':'La cantidad de servidores es el número de ensayos, no el número de fallas. Cada servidor puede fallar o funcionar; el modelo calcula probabilidades para diferentes cantidades de fallas.',
'4f':'Una falla del suministro eléctrico compartido puede afectar simultáneamente a varios servidores. Esto viola la independencia y puede elevar el riesgo de interrupción respecto del modelo binomial.',
'5f':'La tasa de 18 solicitudes corresponde a 3 minutos. Para un minuto se debe usar λ = 18 × (1/3) = 6. Usar 18 directamente sobrestimaría la frecuencia esperada en ese intervalo.',
'6e':'El proceso termina cuando se alcanzan 6 pruebas satisfactorias. El número de intentos necesarios es aleatorio, aunque la meta de éxitos está fijada.',
'6f':'Si las correcciones alteran la probabilidad de éxito en pruebas sucesivas, los intentos dejan de ser idénticos y posiblemente independientes. Se requeriría un modelo que considere la evolución del software.',
'7f':'La tasa y el tiempo deben expresarse en unidades compatibles: 12 mensajes/minuto equivalen a 0.2 mensajes/segundo. Si llegan mensajes en lotes programados, puede dejar de cumplirse la llegada independiente con tasa constante; el tiempo de espera podría no ser exponencial.'
};
const partSpec={
1:{a:['exact',3],b:['le',2],c:['ge',4],d:['ge',1],e:['ge',4]},
2:{a:['exact',7],b:['le',8],c:['ge',9],d:['exact',5],e:['le',8]},
3:{b:['exact',12],c:['ge',16],d:['le',3,{lambda:3}],e:['ge',16]},
4:{a:['exact',4],b:['le',3],c:['ge',5],d:['le',3]},
5:{b:['exact',8],c:['ge',11],d:['exact',0,{lambda:3}],e:['ge',11]},
6:{a:['exact',10],b:['le',8],c:['ge',11],d:['ge',9]},
7:{a:['le',4],b:['gt',10],c:['between',3,{upper:8}],d:['quantile',.9],e:['gt',15]},
8:{a:['gt',300],b:['between',210,{upper:280}],c:['lt',200],d:['quantile',.95],e:['le',300],f:['le',300,{mu:220,sigma:55}]}
};
function showPart(id,letter){
 const target=document.getElementById(`detail-${id}-${letter}`);if(!target)return;
 if(target.innerHTML){target.innerHTML='';return}
 const key=id+letter;
 if(conceptual[id]?.[letter]){target.innerHTML=`<div class="detail"><h4>Análisis técnico</h4><p>${explanations[key]}</p></div>`;return}
 const pb=problems[id-1],d=pb[1],s={...initial[d],...pb[2]};
 const sp=partSpec[id]?.[letter];if(sp){s.mode=sp[0];s.k=sp[1];Object.assign(s,sp[2]||{})}
 // Each opened item receives its own parameters, editable independently.
 const uid=`${id}-${letter}`;window.partStates??={};window.partStates[uid]={d,s};
 const inputs={bin:[['n','Número de componentes / servidores (n)'],['p','Probabilidad de falla o éxito (p)']],neg:[['r','Éxitos requeridos (r)'],['p','Probabilidad de éxito (p)']],poi:[['lambda','Media λ del intervalo']],exp:[['lambda','Tasa λ por segundo']],nor:[['mu','Media μ'],['sigma','Desviación estándar σ']]};
 let extra='';
 if(id===3&&letter==='a')extra='<p>Media esperada para 20 minutos: λ = 9 × 20 / 15 = 12.</p>';
 if(id===5&&letter==='a')extra='<p>Media esperada para un minuto: λ = 18 / 3 = 6.</p>';
 const showInputs=!(id===3&&letter==='a'||id===5&&letter==='a');
 target.innerHTML=`<div class="detail"><h4>${evaluation[id]?.[letter]?'Evaluación del criterio':'Comprobación matemática'}</h4>${extra}<div class="grid">${showInputs?inputs[d].map(([k,l])=>`<label>${l}<input type="number" step="any" value="${s[k]}" oninput="changePart('${uid}','${k}',this.value)"></label>`).join(''):''}${sp&&!['3a','5a'].includes(key)?`<label>${s.mode==='quantile'?'Probabilidad acumulada':d==='exp'?'Tiempo o probabilidad':'Valor de referencia'}<input type="number" step="any" value="${s.k}" oninput="changePart('${uid}','k',this.value)"></label>`:''}${s.mode==='between'?`<label>Límite superior<input type="number" step="any" value="${s.upper}" oninput="changePart('${uid}','upper',this.value)"></label>`:''}</div><div id="answer-${uid}"></div>${sp?`<p><button onclick="loadPart('${uid}')">Abrir en simulador general</button></p>`:''}</div>`;
 updatePart(uid,id,letter);
}
function changePart(uid,key,value){window.partStates[uid].s[key]=value.trim()===''?NaN:Number(value);let [id,letter]=uid.split('-');updatePart(uid,+id,letter)}
function loadPart(uid){let {d,s}=window.partStates[uid];let [id,letter]=uid.split('-');returnTarget={section:currentSection,id:Number(id),letter};dist=d;state[d]={...s};page('calc')}
function updatePart(uid,id,letter){let el=document.getElementById('answer-'+uid);if(!el)return;let {d,s}=window.partStates[uid];try{
 if((id===3||id===5)&&letter==='a'){el.innerHTML=`<p><strong class="big">${s.lambda}</strong> eventos esperados</p>`;return}
 let [v,quantile]=compute(d,s);let val=quantile?v.toFixed(5):(Math.max(0,Math.min(1,v))*100).toFixed(5)+' %';
 let conclusion='';
 if(id===1&&letter==='e')conclusion=v<=.10?'Cumple: el riesgo de suspensión no supera el 10 %.':'No cumple: el riesgo de suspensión supera el 10 %.';
 if(id===2&&letter==='e')conclusion=v>=.95?'Cumple: la recuperación dentro de 8 intentos alcanza el 95 %.':'No cumple: la recuperación dentro de 8 intentos es inferior al 95 %.';
 if(id===3&&letter==='e')conclusion=v<.05?'Umbral adecuado: la frecuencia normal activa la alerta menos del 5 % de las veces.':'Umbral no adecuado: la frecuencia normal activa la alerta al menos el 5 % de las veces.';
 if(id===4&&letter==='d')conclusion=v>=.95?'Cumple el criterio de disponibilidad operativa del 95 %.':'No cumple el criterio de disponibilidad operativa del 95 %.';
 if(id===5&&letter==='e')conclusion=v>.05?'Se recomienda revisar el umbral: la probabilidad de alerta supera el 5 %.':'El umbral no requiere revisión por este criterio: la probabilidad no supera el 5 %.';
 if(id===7&&letter==='e')conclusion=`La probabilidad de superar el tiempo establecido es ${val}; se espera que ocurra aproximadamente ${(v*100).toFixed(2)} de cada 100 intervalos de espera. Su frecuencia debe evaluarse según la tolerancia operativa.`;
 if(id===8&&letter==='e')conclusion=v>=.95?'Cumple el SLA: al menos el 95 % responde dentro del límite.':'No cumple el SLA: menos del 95 % responde dentro del límite.';
 if(id===8&&letter==='f'){let base=compute('nor',{...s,mu:240,sigma:35,mode:'le',k:300})[0];conclusion=`Escenario original: ${(base*100).toFixed(5)} % dentro de 300 ms. Escenario modificado: ${val}. ${v>=base?'La proporción dentro del SLA no disminuye.':'La proporción dentro del SLA disminuye; una media menor no garantiza mejor cumplimiento cuando aumenta la dispersión.'}`}
 el.innerHTML=`<p><strong class="big">${val}</strong></p>${conclusion?`<p class="${(id===8&&letter==='f')?'':'muted'}">${conclusion}</p>`:''}`;
 }catch(e){el.innerHTML=`<p class="error">${escapeHtml(e.message)}</p>`}}
function load(id,i){returnTarget={section:currentSection,id,letter:problems[id-1][3][i][0]};let t=problems[id-1],p=t[3][i];dist=t[1];state[dist]={...initial[dist],...t[2],...(p[3]||{}),mode:p[1],k:p[2]};page('calc')}
function result(){let el=document.getElementById('out');if(!el)return;let s=state[dist];try{let [v,q]=compute(dist,s);el.innerHTML=`<h3>Resultado</h3><strong class="big">${q?v.toFixed(6):(Math.max(0,Math.min(1,v))*100).toFixed(6)+' %'}</strong><p class="muted">${q?'Valor del cuantil':'Probabilidad decimal: '+v.toFixed(10)}</p><p>Fórmula de referencia: <code>${{bin:'C(n,k)·p^k·(1−p)^(n−k)',neg:'C(k−1,r−1)·p^r·(1−p)^(k−r)',poi:'e^(−λ)·λ^k/k!',exp:'F(t)=1−e^(−λt)',nor:'Z=(x−μ)/σ'}[dist]}</code></p><svg id="graph" viewBox="0 0 800 220"></svg>`;graph()}catch(e){el.innerHTML=`<p class="error">${e.message}</p>`}}
function graph(){let s=state[dist],discrete=['bin','neg','poi'].includes(dist),points=[],end=discrete?(dist==='bin'?Math.min(s.n,65):dist==='neg'?Math.min(65,Math.ceil(s.r/s.p+4*Math.sqrt(s.r*(1-s.p)/(s.p*s.p)))):Math.min(65,Math.ceil(s.lambda+4*Math.sqrt(s.lambda)))):0,start=dist==='neg'?s.r:0;if(discrete){for(let x=start;x<=Math.max(start,end);x++)points.push([x,pmf(dist,x,s)])}else{let lo=dist==='nor'?s.mu-4*s.sigma:0,hi=dist==='nor'?s.mu+4*s.sigma:Math.max(7/s.lambda,s.k*1.5);for(let i=0;i<=100;i++){let x=lo+(hi-lo)*i/100;points.push([x,dist==='nor'?Math.exp(-.5*((x-s.mu)/s.sigma)**2)/(s.sigma*Math.sqrt(2*Math.PI)):s.lambda*Math.exp(-s.lambda*x)])}}let max=Math.max(...points.map(x=>x[1]),.0000001),minX=points[0][0],maxX=points.at(-1)[0],X=x=>35+(x-minX)/(maxX-minX||1)*740,Y=y=>190-y/max*165,html='<line x1="30" y1="190" x2="780" y2="190" stroke="#88aacc"/>';if(discrete){let width=Math.max(2,Math.min(19,650/points.length));for(let [x,y] of points)html+=`<rect x="${X(x)-width/2}" y="${Y(y)}" width="${width}" height="${190-Y(y)}" fill="${x===s.k?'#6ff0cf':'#4da7df'}"/>`}else html+=`<polyline fill="none" stroke="#65d9ff" stroke-width="3" points="${points.map(([x,y])=>X(x)+','+Y(y)).join(' ')}"/>`;document.getElementById('graph').innerHTML=html}
page('home');
</script></html>
